name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.5.0
          name: Cast16x9 v1.5.0 Release (4K TV Database Caching & Glitch-Free Seeking)
          body: |
            ### Cast16x9 v1.5.0 Release - 4K TV Database Caching & Glitch-Free Seeking
            - **Browser Database & Fast 4K Caching (IndexedDB)**: Eliminates all seek restarts and buffering glitches. Caches the full video into TV local browser storage for instantaneous 0ms forward/backward seeking without network dependency.
            - **Flawless 4K 60fps Playback**: Plays from locally demuxed Blob memory, unlocking full hardware 4K decoding with zero frame drops or Wi-Fi jitter.
            - **TV Remote Navigation Controls**: Left/Right arrows skip 10 seconds forward/backward smoothly, Space/OK toggles play/pause, with live TV seek HUD.
            - **Fixed Duplicate Content-Length & Buffered Streaming**: Fixed HTTP 206 range response headers in the embedded Android server for seamless native DLNA seeking.
            - **Unmuted TV Audio Engine**: Full UPnP video class metadata and zero-click TV browser autoplay unmute.
            - **Zero-Lag 16:9 Screen Mirroring (<35ms)**: Hardware-accelerated memory pool and direct binary WebSocket push.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
