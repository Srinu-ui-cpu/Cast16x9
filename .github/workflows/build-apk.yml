name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master", "v2-next" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Run Cast16x9 5GB Movie Simulation
        run: node test-suite/simulation-5gb.js

      - name: Run Cast16x9 6GB Movie Simulation
        run: node test-suite/simulation-6gb.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-V2-Pro.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-V2-Pro-APK
          path: release-output/Cast16x9-V2-Pro.apk
          retention-days: 30

      - name: Create GitHub Release for V2 Pro
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-pro
          name: Cast16x9 v2.1.0 Pro Release (16:9 Ambient Canvas, Audio Mirroring, Zoom Adjuster & Immediate Media Stop)
          body: |
            ### 🚀 Cast16x9 V2 Pro (v2.1.0-pro)

            **Install Side-by-Side with V1**: Package name is `com.cast16x9.app.v2`, allowing both V1 and V2 Pro to be installed simultaneously on your device without conflict!

            #### What's New & Fixed in V2 Pro:
            1. **📺 Black Screen Mirroring Fixed (100% Reliable Screen Mirroring)**:
               - Fixed single-use Android 14 `MediaProjection` token invalidation.
               - Added universal binary fallback for Smart TV WebKit & Chromium browsers (`Blob` and `ArrayBuffer`).
               - Safe asynchronous blob URL revocation pipeline (`pendingRevokeUrl`) prevents premature disposal while TV hardware decodes 1080p frames.
            2. **⏹️ Immediate Media Stop & Cancel on TV Browser**:
               - Canceled media on the phone immediately pauses, unloads, and frees TV browser video player and IndexedDB memory without requiring a page refresh!
               - Background safety net polls `/api/status` and detects `!data.hasMedia` within 1.5 seconds.
            3. **✨ 16:9 Ambient Canvas (100% Full Phone Screen, Zero Cropping)**:
               - Eliminates the flaw of classic 16:9 Cover mode that cut off 70% of tall (20:9) phone screens.
               - Real-time hardware-accelerated blurred ambient wings dynamically fill TV side borders with matching colors (0 black bars).
            4. **🔍 Interactive Zoom & Scale Adjuster**:
               - Real-time zoom slider (50% to 150%) available on both TV receiver screen and Android phone app.
               - TV remote shortcut keys `4` (Zoom Out), `5` (Zoom In), and `0` (Reset to 100%).
            5. **🔊 Screen Mirroring Audio & Private Listening**:
               - Streams system, game, video, and app sound directly to your TV speakers.
               - 1-tap Private Listening switch in mobile app routes audio to phone speakers/headphones.
            6. **🎬 6GB+ Movie Seeking & Instant TV Caching Engine**:
               - Retains full hardware O(1) kernel fstat seeking and IndexedDB database caching with zero glitching or restarting from 00:00.
          files: release-output/Cast16x9-V2-Pro.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
