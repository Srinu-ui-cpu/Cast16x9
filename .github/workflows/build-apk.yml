name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: Cast16x9 v1.0.0 Release APK
          body: |
            ### Cast16x9 - Full Screen 16:9 Screen Mirror & Media Beamer
            - **Eliminate Black Bars**: Supports 16:9 Zoom/Cover and Stretch modes for smartwatches (1:1) and tall phones (20:9).
            - **Direct Media Beaming**: Stream 1080p/4K videos and photos directly to your TV.
            - **No TV APK Required**: Works on Samsung Tizen, LG webOS, Android TV, Fire TV, and PC via TV Web Receiver or DLNA.
            - **File Sharing**: Over-the-air file download and sharing.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
