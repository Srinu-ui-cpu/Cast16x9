name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.8.0
          name: Cast16x9 v1.8.0 Release (Universal HTTP 206 Byte-Range Seeking Engine)
          body: |
            ### Cast16x9 v1.8.0 Universal Release
            - **Universal HTTP 206 Partial Content Pipeline**: Eliminated the 30MB Smart TV browser memory cap completely. The TV now streams directly using native hardware video decoding via standard HTTP/1.1 byte ranges.
            - **Instant Glitch-Free O(1) Seeking**: Moving forward or backward on the TV remote or seekbar resolves in < 5ms via dedicated file channel seeks, resuming instantly with ZERO restart to 0:00.
            - **5-Way Fallback File Length Resolver**: Uses AssetFileDescriptor, MediaStore SIZE, OpenableColumns, ParcelFileDescriptor, and direct file path to guarantee exact file size and duration on all Android devices.
            - **HTTP HEAD & Suffix Range Compliance**: Fully handles browser video player probe requests (`Method.HEAD`), returning standard `Accept-Ranges: bytes`, `ETag`, and `Content-Length`.
            - **Zero TV RAM / Zero Quota Overhead**: Video plays directly without storing gigabytes in TV JavaScript memory or IndexedDB, completely preventing TV browser memory crashes.
            - **Instant Video Cancellation**: Cancel buttons in both Phone APK and TV Web Receiver immediately free all resources for seamless video switching.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
