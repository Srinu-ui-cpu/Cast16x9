name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Run Cast16x9 5GB Movie Simulation
        run: node test-suite/simulation-5gb.js

      - name: Run Cast16x9 6GB Movie Simulation
        run: node test-suite/simulation-6gb.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: Cast16x9 v2.0.0 Master Release (6GB+ Ultra-Fast Seeking, Kernel fstat & Zero Restart Fix)
          body: |
            ### Cast16x9 v2.0.0 Master Release
            - **6GB+ Movie Ultra-Fast Seeking**: Completely resolved the forward-seeking glitch and restart-to-0 issue on large movies (tested up to 6.00 GB). Forward and rewind seek operations now respond in < 15 ms.
            - **Authoritative 64-bit Linux Kernel `fstat` & `lseek`**: Directly queries the kernel inode via `Os.fstat(fd).st_size` and sets offsets with `Os.lseek(fd, start, SEEK_SET)`. Completely eliminated the blocking `fis.skip` loop that caused 40-second stalls and TV browser timeouts.
            - **WebSocket `init_state` Playback Guard**: Fixed the critical bug where background WebSocket reconnects triggered `init_state` and forcibly reset active video playback back to 00:00. Active streams are now protected and uninterrupted.
            - **Remote Seek Debouncing & Error Auto-Recovery**: Prevents concurrent overlapping HTTP 206 range requests when rapidly pressing remote seek buttons, ensuring smooth hardware decoding without crashes.
            - **Android Scoped Storage & MANAGE_EXTERNAL_STORAGE**: Added `android:requestLegacyExternalStorage="true"` and `MANAGE_EXTERNAL_STORAGE` permission for frictionless POSIX access to 6GB+ movie files across internal and SD card storage.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
