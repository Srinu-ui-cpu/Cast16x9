name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Run Cast16x9 5GB Movie Simulation
        run: node test-suite/simulation-5gb.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.9.0
          name: Cast16x9 v1.9.0 Final Release (5GB+ Movie Ultra-Fast Seeking & Hardware Seek Engine)
          body: |
            ### Cast16x9 v1.9.0 Final Release
            - **5GB+ Movie Ultra-Fast Fast-Forwarding**: Solved the forward-seeking glitch and restart-to-0 issue completely. Users can scrub forward to 1.5 GB, 3.5 GB, or even 5.1 GB near the end of a movie, and playback resumes smoothly in milliseconds.
            - **Kernel-Level O(1) RandomAccessFile Seeking**: Replaced sequential ContentProvider IPC stream skips with direct Linux `lseek64()` via `RandomAccessFile(file, "r")` and `Os.lseek`. Seeking any position is instantaneous regardless of file size (50 MB or 50 GB).
            - **CORS Range Header Exposure**: Added `Access-Control-Expose-Headers: Content-Range, Content-Length, Accept-Ranges, ETag` so Smart TV web engines recognize byte-range slice responses without reverting to start.
            - **Lifecycle Seeking & Auto-Resume**: TV Web Receiver hooks `seeking` and `seeked` events with real-time HUD timestamps and instant decode auto-resume.
            - **Universal HTTP 206 Partial Content Pipeline**: Streams directly to TV hardware decoders without hitting browser memory limits.
            - **Instant Video Cancellation**: Cancel buttons in both Phone APK and TV Web Receiver immediately free all resources for seamless video switching.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
