name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.7.0
          name: Cast16x9 v1.7.0 Release (Instant Cancel, Auto DB Purge & Real-Time TV Space Reclaim)
          body: |
            ### Cast16x9 v1.7.0 Release
            - **Instant Cancel Video & Space Purge**: Added high-visibility `[ ❌ Cancel Video & Free TV Space ]` button in the TV web receiver floating overlay and caching dialog, plus active controls in the mobile APK (`[ ❌ Cancel & Free TV Space ]` and `[ 🔄 Switch Video ]`).
            - **Atomic TV Storage & RAM Purge**: Immediately aborts network download, revokes blob object URLs, wipes IndexedDB database (`Cast16x9_MediaDB`), and deletes Cache API entries the exact moment cancel is pressed, freeing 100% of TV storage and RAM for the next video.
            - **Two-Way Real-Time State Sync**: Canceling video on TV immediately hides the active casting card in the mobile APK via WebSocket and HTTP `/api/media/cancel`, and stopping from APK resets TV receiver instantly.
            - **TV Remote Shortcuts**: Pressing <kbd>Esc</kbd>, <kbd>Backspace</kbd>, <kbd>C</kbd>, or <kbd>0</kbd> on any TV remote immediately cancels media and purges TV storage.
            - **Zero-Glitch Fresh Media Beaming**: Every newly cast video gets a unique timestamp ID (`/media/active?id=<id>&t=<time>`) ensuring previous videos are never replayed.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
