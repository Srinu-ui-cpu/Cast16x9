name: Build & Release Cast16x9 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js for Diagnostic Test Suite
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cast16x9 Automated Diagnostic Test Suite
        run: node test-suite/run-tests.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Cast16x9-FullTV-ScreenMirror.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cast16x9-FullTV-ScreenMirror-APK
          path: release-output/Cast16x9-FullTV-ScreenMirror.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.6.0
          name: Cast16x9 v1.6.0 Release (Cancel Video, Multi-Video Switching & Auto-Purge TV DB)
          body: |
            ### Cast16x9 v1.6.0 Release
            - **Cancel / Close Video Button in TV Browser UI**: Added a prominent on-screen `[ ⏹ Cancel Video ]` button in the TV web receiver. Immediately closes video, resets player, wipes the video from TV IndexedDB / Cache storage, and returns to standby.
            - **In-App Active Casting Card & Video Switcher**: Added active casting card in the phone APK with `[ ⏹ Stop / Cancel ]` and `[ 🔄 Change Video ]` buttons to switch between videos effortlessly.
            - **Auto-Purge & Fresh Video Streaming**: Fixed the bug where the TV replayed the old video when switching files by generating unique cache-busting media IDs, adding `Cache-Control: no-cache, no-store`, and automatically clearing TV database storage on cancel or new beam.
            - **TV Remote Shortcuts**: Pressing <kbd>Esc</kbd>, <kbd>Backspace</kbd>, or <kbd>C</kbd> instantly closes the video and purges TV storage. Left/Right arrows seek 10s smoothly.
            - **4K Glitch-Free IndexedDB Database**: Full 4K 60fps playback from locally demuxed Blob storage with 0ms seek latency.
          files: release-output/Cast16x9-FullTV-ScreenMirror.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
